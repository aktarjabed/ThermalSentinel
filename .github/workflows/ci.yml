name: CI

on:
  push:
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest ships an Android SDK (ANDROID_HOME). Accept licenses so
      # AGP can download any missing platform / build-tools component.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make wrapper executable
        run: chmod +x gradlew

      - name: Unit tests, debug + release build, lint
        shell: bash
        run: ./gradlew testDebugUnitTest assembleDebug assembleRelease lintDebug --continue --stacktrace 2>&1 | tee build.log

      # Surface the first compiler / Gradle errors as a check annotation so a
      # failure is readable without downloading the full log.
      - name: Summarise failure
        if: failure()
        shell: bash
        run: |
          {
            grep -E '^e: |^w: .*Screens|FAILED|What went wrong|Execution failed|error:|Unresolved|> Task .* FAILED' build.log | head -60
          } > errors.txt || true
          msg=$(sed -e 's/%/%25/g' -e 's/\r//g' errors.txt | awk '{printf "%s%%0A", $0}')
          echo "::error title=Gradle failure (first lines)::${msg:-no matching lines; see full log}"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            build.log
            app/build/reports/**
            app/build/test-results/**
          if-no-files-found: ignore
